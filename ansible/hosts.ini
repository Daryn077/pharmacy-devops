[web]
vm1 ansible_host=127.0.0.1 ansible_port=2221

[storage]
vm2 ansible_host=127.0.0.1 ansible_port=2222

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/pharmacy_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
